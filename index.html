<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07111c">
  <title>WaveLab · 从波到 k 空间</title>
  <meta name="description" content="一个交互式傅里叶与波包学习实验室。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="WaveLab 首页">
        <svg class="brand-mark" viewBox="0 0 48 28" aria-hidden="true">
          <path d="M2 14c5 0 5-10 10-10s5 20 10 20 5-20 10-20 5 10 10 10 4-4 4-4"/>
        </svg>
        <span>WaveLab</span>
        <small>波与傅里叶</small>
      </a>

      <nav class="path-nav" aria-label="五步学习路径" id="top-scene-nav"></nav>

      <div class="top-actions">
        <button class="icon-button" id="play-button" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>
          <span>播放</span>
        </button>
        <button class="icon-button" id="reset-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
          <span>重置</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="lesson-rail" aria-label="课程章节">
        <div class="rail-heading">学习路径 <span>共 5 步</span></div>
        <nav class="rail-nav" id="side-scene-nav"></nav>
        <div class="rail-footer">
          <span class="rail-line"></span>
          <span>下一章</span>
          <strong>波函数与 Bloch 波</strong>
        </div>
      </aside>

      <main class="workspace">
        <section class="lab-column" aria-labelledby="scene-title">
          <header class="scene-header">
            <div>
              <p class="scene-eyebrow" id="scene-eyebrow">01 · 认识一个波</p>
              <h1 id="scene-title">一个波由什么决定？</h1>
            </div>
            <p class="scene-summary" id="scene-summary">改变参数，观察图像和公式如何同步响应。</p>
          </header>

          <section class="visual-stage" aria-label="交互图像区域">
            <div class="stage-toolbar">
              <div class="view-switch" role="group" aria-label="图像视图">
                <button type="button" data-view="2d" aria-pressed="true">2D 对照</button>
                <button type="button" data-view="3d" aria-pressed="false">3D 相位</button>
              </div>
              <span class="view-hint" id="view-hint">二维图精确比较实空间与 k 空间</span>
            </div>
            <div class="plot-grid" id="plot-grid">
              <article class="plot-block">
                <header class="plot-heading">
                  <div>
                    <span class="plot-space" id="left-space">实空间 x</span>
                    <span class="plot-subtitle" id="left-subtitle">波形 f(x,t)</span>
                  </div>
                  <span class="plot-status" id="left-status">t = 0.00</span>
                </header>
                <div class="canvas-wrap">
                  <canvas id="left-canvas" role="img" aria-label="实空间波形图"></canvas>
                  <div class="canvas-tooltip" id="left-tooltip" hidden></div>
                </div>
              </article>

              <div class="transform-mark" id="transform-mark" aria-hidden="true">
                <span>ℱ</span>
                <svg viewBox="0 0 46 24"><path d="M2 7h39m0 0-6-5m6 5-6 5M44 17H5m0 0 6-5m-6 5 6 5"/></svg>
              </div>

              <article class="plot-block secondary-plot" id="secondary-plot">
                <header class="plot-heading">
                  <div>
                    <span class="plot-space" id="right-space">复指数</span>
                    <span class="plot-subtitle" id="right-subtitle">相位投影</span>
                  </div>
                  <span class="plot-status" id="right-status">θ = 0.00</span>
                </header>
                <div class="canvas-wrap">
                  <canvas id="right-canvas" role="img" aria-label="复指数相位或 k 空间图"></canvas>
                  <div class="canvas-tooltip" id="right-tooltip" hidden></div>
                </div>
              </article>
            </div>
            <div class="three-stage" id="three-stage" hidden>
              <canvas id="three-canvas" role="img" aria-label="可旋转的三维复波与波包图"></canvas>
              <div class="axis-triad" aria-hidden="true">
                <span class="axis-x">x</span><span class="axis-y">Re</span><span class="axis-z">Im</span>
              </div>
              <div class="orbit-hint">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7a2 2 0 0 1 4 0v3-5a2 2 0 0 1 4 0v5-2a2 2 0 0 1 4 0v5c0 5-3 8-8 8h-1a7 7 0 0 1-5-2l-3-3a2 2 0 0 1 3-3l2 2v-4Z"/></svg>
                <span>拖动旋转 · 滚轮缩放</span>
              </div>
              <button class="camera-reset" id="camera-reset" type="button">重置视角</button>
            </div>
          </section>

          <section class="control-deck" aria-labelledby="control-title">
            <div class="control-topline">
              <h2 id="control-title">参数</h2>
              <div class="preset-group" id="preset-group" role="group" aria-label="波形预设"></div>
            </div>
            <div class="controls-grid" id="controls-grid"></div>
          </section>

          <footer class="formula-dock">
            <div class="formula-copy">
              <span class="formula-label">当前表达</span>
              <div class="formula" id="formula" aria-live="off"></div>
            </div>
            <div class="live-readout" id="live-readout" aria-live="polite"></div>
            <div class="scene-actions">
              <button class="text-button" id="prev-button" type="button">← 上一步</button>
              <button class="next-button" id="next-button" type="button">下一步 <span>→</span></button>
            </div>
          </footer>
        </section>

        <aside class="concept-panel" aria-labelledby="concept-title">
          <div class="concept-index" id="concept-index">01</div>
          <h2 id="concept-title">振幅、波数与相位</h2>
          <p class="concept-body" id="concept-body"></p>
          <div class="insight-block">
            <span>此刻要看到</span>
            <strong id="key-insight">k 越大，波峰越密。</strong>
          </div>
          <ul class="concept-facts" id="concept-facts"></ul>
          <button class="why-button" id="why-button" type="button">
            <span class="why-icon">?</span>
            <span><strong>为什么？</strong><small id="why-prompt">深入理解 k 为什么自然出现</small></span>
            <span aria-hidden="true">↗</span>
          </button>
        </aside>
      </main>
    </div>

    <button class="mobile-concept-button" id="mobile-concept-button" type="button">
      <span>当前结论</span><strong id="mobile-insight">k 越大，波峰越密。</strong><span aria-hidden="true">↑</span>
    </button>

    <dialog class="why-dialog" id="why-dialog" aria-labelledby="why-title">
      <div class="dialog-topline">
        <span class="dialog-label">WHY · 深入一层</span>
        <button class="dialog-close" id="dialog-close" type="button" aria-label="关闭解释">×</button>
      </div>
      <h2 id="why-title">为什么？</h2>
      <div class="why-layers">
        <section>
          <span class="layer-number">01</span>
          <div><h3>直觉</h3><p id="why-intuition"></p></div>
        </section>
        <section>
          <span class="layer-number">02</span>
          <div><h3>数学</h3><p id="why-math"></p><div class="dialog-formula" id="why-formula"></div></div>
        </section>
        <section>
          <span class="layer-number">03</span>
          <div><h3>别混淆</h3><p id="why-mistake"></p></div>
        </section>
      </div>
      <button class="dialog-next" id="dialog-next" type="button">明白了，继续实验</button>
    </dialog>
  </div>

  <noscript>WaveLab 需要启用 JavaScript 才能运行交互实验。</noscript>
  <script src="three-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
